<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Quiz · Proteínas plasmáticas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous"/>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
:root {
  --bg:        #0b0f1a;
  --surface:   #111827;
  --card:      #151e2e;
  --border:    #1e2d42;
  --border2:   #253044;
  --primary:   #4f9cf9;
  --primary2:  #2563eb;
  --accent:    #f87171;
  --gold:      #f59e0b;
  --emerald:   #34d399;
  --rose:      #fb7185;
  --text:      #e2e8f0;
  --muted:     #64748b;
  --muted2:    #94a3b8;
  --correct-bg:#0a2e1f;
  --correct-b: #34d399;
  --wrong-bg:  #2e0a14;
  --wrong-b:   #fb7185;
  --just-bg:   #0d1b2e;
  --just-b:    #4f9cf9;
  --radius:    14px;
  --trans:     all .28s cubic-bezier(.4,0,.2,1);
}

*{margin:0;padding:0;box-sizing:border-box;}

body {
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:1.5rem 1rem 3rem;
  position:relative;
  overflow-x:hidden;
}

/* ── BACKGROUND MESH ── */
body::before{
  content:'';
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse 60% 50% at 20% 10%, rgba(79,156,249,.07) 0%, transparent 70%),
    radial-gradient(ellipse 50% 60% at 80% 90%, rgba(248,113,113,.05) 0%, transparent 70%),
    radial-gradient(ellipse 40% 40% at 60% 40%, rgba(52,211,153,.04) 0%, transparent 60%);
  pointer-events:none;z-index:0;
}

/* ── HEADER ── */
.header{
  width:100%;max-width:820px;
  text-align:center;
  margin-bottom:2rem;
  position:relative;z-index:1;
}
.header-badge{
  display:inline-flex;align-items:center;gap:.45rem;
  background:rgba(79,156,249,.12);
  border:1px solid rgba(79,156,249,.25);
  border-radius:50px;
  padding:.3rem .9rem;
  font-size:.75rem;font-weight:500;
  color:var(--primary);
  letter-spacing:.06em;text-transform:uppercase;
  margin-bottom:1rem;
}
.header h1{
  font-family:'Crimson Pro',serif;
  font-size:clamp(1.8rem,4vw,2.6rem);
  font-weight:700;
  line-height:1.2;
  color:#f1f5f9;
  letter-spacing:-.02em;
}
.header h1 span{color:var(--primary);}
.header p{
  color:var(--muted2);
  font-size:.92rem;
  margin-top:.5rem;
}

/* ── QUIZ CONTAINER ── */
#quiz-container{
  width:100%;max-width:820px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:22px;
  padding:2.2rem 2rem;
  position:relative;z-index:1;
  box-shadow:0 24px 60px rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,.04) inset;
}

/* top accent line */
#quiz-container::before{
  content:'';position:absolute;
  top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--primary2),var(--primary),var(--accent));
  border-radius:22px 22px 0 0;
}

/* ── PROGRESS ── */
.progress-wrapper{
  display:flex;align-items:center;gap:.9rem;
  margin-bottom:1.8rem;
}
.progress-track{
  flex:1;height:6px;
  background:var(--border2);
  border-radius:50px;overflow:hidden;
}
.progress-fill{
  height:100%;
  background:linear-gradient(90deg,var(--primary2),var(--primary));
  border-radius:50px;
  transition:width .5s cubic-bezier(.4,0,.2,1);
  box-shadow:0 0 10px rgba(79,156,249,.5);
}
.progress-label{
  font-size:.78rem;font-weight:500;
  color:var(--muted2);
  white-space:nowrap;min-width:60px;text-align:right;
  font-family:'DM Mono',monospace;
}

/* ── QUESTION CARD ── */
.question-card{
  display:none;flex-direction:column;align-items:stretch;
  animation:slideIn .38s cubic-bezier(.4,0,.2,1);
}
.question-card.active{display:flex;}

@keyframes slideIn{
  from{opacity:0;transform:translateY(18px);}
  to{opacity:1;transform:translateY(0);}
}

.q-meta{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:1.4rem;
}
.q-num{
  font-family:'DM Mono',monospace;
  font-size:.75rem;font-weight:500;
  color:var(--muted);
  letter-spacing:.05em;
  text-transform:uppercase;
}
.q-type-badge{
  font-size:.68rem;font-weight:600;
  padding:.2rem .6rem;border-radius:50px;
  letter-spacing:.06em;text-transform:uppercase;
}
.badge-multi{background:rgba(79,156,249,.15);color:var(--primary);border:1px solid rgba(79,156,249,.3);}
.badge-tf{background:rgba(245,158,11,.12);color:var(--gold);border:1px solid rgba(245,158,11,.3);}

.question-text{
  font-family:'Crimson Pro',serif;
  font-size:1.28rem;font-weight:400;
  line-height:1.6;
  color:#f1f5f9;
  margin-bottom:1.6rem;
  padding-bottom:1.4rem;
  border-bottom:1px solid var(--border);
}

/* ── OPTIONS ── */
.options-container{display:flex;flex-direction:column;gap:.65rem;}
.tf-options-container{display:flex;gap:.75rem;justify-content:center;}

.mc-option{
  display:flex;align-items:center;gap:.85rem;
  background:var(--surface);
  border:1.5px solid var(--border);
  border-radius:var(--radius);
  padding:.9rem 1.1rem;
  cursor:pointer;
  transition:var(--trans);
  color:var(--text);
  font-size:.95rem;
  text-align:left;
  position:relative;overflow:hidden;
}
.mc-option::after{
  content:'';position:absolute;inset:0;
  background:var(--primary);
  opacity:0;transition:opacity .2s;
}
.mc-option:hover:not(.disabled){
  border-color:var(--primary);
  transform:translateX(4px);
  box-shadow:0 4px 16px rgba(79,156,249,.15);
}
.mc-option.selected{
  border-color:var(--primary);
  background:rgba(79,156,249,.08);
}

.tf-option{
  flex:1;max-width:200px;
  padding:1rem 1.5rem;
  border-radius:var(--radius);
  font-size:1rem;font-weight:600;
  cursor:pointer;
  transition:var(--trans);
  font-family:'DM Sans',sans-serif;
}
.tf-option.tf-v{
  background:rgba(52,211,153,.08);
  border:1.5px solid rgba(52,211,153,.25);
  color:var(--emerald);
}
.tf-option.tf-f{
  background:rgba(251,113,133,.08);
  border:1.5px solid rgba(251,113,133,.25);
  color:var(--rose);
}
.tf-option:hover:not(.disabled){transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.25);}
.tf-option.selected{box-shadow:0 0 0 3px rgba(79,156,249,.4);}
.tf-option.tf-v.selected{background:rgba(52,211,153,.18);border-color:var(--emerald);}
.tf-option.tf-f.selected{background:rgba(251,113,133,.18);border-color:var(--rose);}

/* correct / incorrect highlights */
.mc-option.correct,.tf-option.correct{
  background:rgba(52,211,153,.1) !important;
  border-color:var(--emerald) !important;
  color:var(--emerald);
}
.mc-option.incorrect,.tf-option.incorrect{
  background:rgba(251,113,133,.1) !important;
  border-color:var(--rose) !important;
  color:var(--rose);
}
.mc-option.disabled,.tf-option.disabled{cursor:not-allowed;}

.option-indicator{
  min-width:28px;height:28px;
  border-radius:8px;
  background:var(--border2);
  display:flex;align-items:center;justify-content:center;
  font-family:'DM Mono',monospace;
  font-size:.78rem;font-weight:600;
  color:var(--muted2);
  flex-shrink:0;
  transition:var(--trans);
}
.mc-option.selected .option-indicator{background:var(--primary);color:#fff;}
.mc-option.correct  .option-indicator{background:var(--emerald);color:#0a2e1f;}
.mc-option.incorrect .option-indicator{background:var(--rose);color:#2e0a14;}

/* ── FEEDBACK BOX ── */
.feedback{
  margin-top:1.4rem;
  border-radius:var(--radius);
  overflow:hidden;
  display:none;
  animation:slideIn .35s ease;
}
.feedback.correct{display:block;}
.feedback.incorrect{display:block;}

.feedback-verdict{
  display:flex;align-items:center;gap:.6rem;
  padding:.75rem 1.1rem;
  font-weight:600;font-size:.95rem;
}
.feedback.correct .feedback-verdict{
  background:rgba(52,211,153,.15);
  color:var(--emerald);
  border-left:4px solid var(--emerald);
}
.feedback.incorrect .feedback-verdict{
  background:rgba(251,113,133,.15);
  color:var(--rose);
  border-left:4px solid var(--rose);
}

/* ── JUSTIFICATION PANEL ── */
.justification{
  background:var(--just-bg);
  border:1px solid rgba(79,156,249,.18);
  border-top:none;
  padding:1.1rem 1.3rem;
}
.just-label{
  display:flex;align-items:center;gap:.5rem;
  font-size:.72rem;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;
  color:var(--primary);
  margin-bottom:.65rem;
  opacity:.8;
}
.just-label i{font-size:.8rem;}
.just-text{
  font-size:.9rem;
  line-height:1.75;
  color:#b8cce4;
}
.just-text strong{color:var(--primary);font-weight:600;}
.just-text em{color:var(--gold);font-style:normal;}
.just-text .correct-list{
  margin-top:.6rem;padding-left:1rem;
  list-style:none;
}
.just-text .correct-list li{
  padding:.25rem 0;
  padding-left:1.1rem;
  position:relative;
  color:#c7ddf4;
}
.just-text .correct-list li::before{
  content:'✦';
  position:absolute;left:0;
  color:var(--emerald);font-size:.7rem;
  top:.35rem;
}
.just-text .tag{
  display:inline-block;
  background:rgba(79,156,249,.12);
  border:1px solid rgba(79,156,249,.25);
  color:var(--primary);
  border-radius:4px;
  padding:.05rem .35rem;
  font-family:'DM Mono',monospace;
  font-size:.8em;
}

/* ── NAVIGATION BUTTONS ── */
#navigation-buttons{
  display:flex;justify-content:center;
  gap:.75rem;flex-wrap:wrap;
  margin-top:1.8rem;
}
.nav-btn{
  display:none;align-items:center;gap:.5rem;
  padding:.7rem 1.5rem;
  border-radius:50px;
  font-size:.9rem;font-weight:600;
  cursor:pointer;
  transition:var(--trans);
  font-family:'DM Sans',sans-serif;
  border:none;
}
.nav-btn.show{display:flex;}
.nav-btn:disabled{opacity:.4;cursor:not-allowed;transform:none !important;}
.nav-btn:hover:not(:disabled){transform:translateY(-2px);}

#prev-btn{
  background:transparent;
  color:var(--primary);
  border:1.5px solid rgba(79,156,249,.4);
}
#prev-btn:hover:not(:disabled){background:rgba(79,156,249,.08);}
#answer-btn{
  background:linear-gradient(135deg,var(--primary2),var(--primary));
  color:#fff;
  box-shadow:0 4px 18px rgba(79,156,249,.35);
}
#answer-btn:hover:not(:disabled){box-shadow:0 6px 24px rgba(79,156,249,.5);}
#next-btn{
  background:var(--surface);
  color:var(--text);
  border:1.5px solid var(--border);
}
#next-btn:hover:not(:disabled){border-color:var(--primary);}
#submit-btn{
  background:linear-gradient(135deg,#7c3aed,var(--primary2));
  color:#fff;
  box-shadow:0 4px 18px rgba(124,58,237,.35);
}

/* ── RESULTS ── */
#results-container,#report-container{
  display:none;flex-direction:column;align-items:center;
}
.score-ring-wrap{position:relative;margin:1rem auto 1.5rem;}
.score-ring-wrap svg{display:block;}
.score-center{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.score-pct{
  font-family:'Crimson Pro',serif;
  font-size:2.8rem;font-weight:700;
  color:var(--primary);line-height:1;
}
.score-label{font-size:.75rem;color:var(--muted2);margin-top:.15rem;}
.score-stat{
  font-size:1.1rem;color:var(--muted2);margin-bottom:.5rem;
}
.score-stat strong{color:var(--text);}
.feedback-msg{
  font-family:'Crimson Pro',serif;
  font-size:1.4rem;font-weight:400;
  color:#e2e8f0;
  margin-bottom:1.5rem;text-align:center;
}
.action-buttons{display:flex;gap:.75rem;flex-wrap:wrap;justify-content:center;}
.action-btn{
  display:flex;align-items:center;gap:.5rem;
  padding:.7rem 1.4rem;
  border-radius:50px;
  font-size:.9rem;font-weight:600;
  cursor:pointer;border:none;
  transition:var(--trans);
  font-family:'DM Sans',sans-serif;
}
.action-btn:hover{transform:translateY(-2px);}
.btn-report{background:var(--surface);color:var(--text);border:1.5px solid var(--border);}
.btn-retry{background:linear-gradient(135deg,var(--primary2),var(--primary));color:#fff;box-shadow:0 4px 16px rgba(79,156,249,.3);}

/* ── REPORT ── */
.report-item{
  width:100%;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:1.1rem 1.3rem;
  margin-bottom:.8rem;
  text-align:left;
  border-left:4px solid;
}
.report-item.correct{border-left-color:var(--emerald);}
.report-item.incorrect{border-left-color:var(--rose);}
.report-item p{font-size:.88rem;line-height:1.6;color:var(--muted2);}
.report-item p strong{color:var(--text);}
.report-item .ri-q{font-size:.95rem;color:var(--text);margin-bottom:.4rem;font-weight:500;}

/* ── FOOTER ── */
.footer{
  margin-top:2rem;
  font-size:.75rem;
  color:var(--muted);
  text-align:center;
  position:relative;z-index:1;
}

/* ── RESPONSIVE ── */
@media(max-width:600px){
  #quiz-container{padding:1.4rem 1rem;}
  .question-text{font-size:1.1rem;}
  .tf-options-container{flex-direction:column;align-items:stretch;}
  .tf-option{max-width:none;}
}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
</style>
</head>
<body>

<div class="header">
  <div class="header-badge"><i class="fas fa-atom"></i> Medicina · Hematologia</div>
  <h1>Proteínas plasmáticas</h1>
  <p>Quiz de alta performance com justificativas clínico-moleculares</p>
</div>

<div id="quiz-container">
  <div class="progress-wrapper">
    <div class="progress-track"><div class="progress-fill" id="quiz-progress" style="width:0%"></div></div>
    <div class="progress-label" id="progress-label">0 / 0</div>
  </div>

  <div id="quiz-content"></div>

  <div id="navigation-buttons">
    <button id="prev-btn"   class="nav-btn"><i class="fas fa-arrow-left"></i> Voltar</button>
    <button id="answer-btn" class="nav-btn show">Responder <i class="fas fa-check"></i></button>
    <button id="next-btn"   class="nav-btn">Próximo <i class="fas fa-arrow-right"></i></button>
    <button id="submit-btn" class="nav-btn"><i class="fas fa-flag-checkered"></i> Ver Resultados</button>
  </div>

  <div id="results-container">
    <div class="score-ring-wrap">
      <svg width="160" height="160" viewBox="0 0 160 160">
        <circle cx="80" cy="80" r="65" fill="none" stroke="#1e2d42" stroke-width="12"/>
        <circle id="score-ring" cx="80" cy="80" r="65" fill="none"
                stroke="url(#ringGrad)" stroke-width="12"
                stroke-linecap="round" stroke-dasharray="408.4"
                stroke-dashoffset="408.4"
                transform="rotate(-90 80 80)"
                style="transition:stroke-dashoffset 1s cubic-bezier(.4,0,.2,1)"/>
        <defs>
          <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#2563eb"/>
            <stop offset="100%" stop-color="#4f9cf9"/>
          </linearGradient>
        </defs>
      </svg>
      <div class="score-center">
        <div class="score-pct" id="pct-display">0%</div>
        <div class="score-label">acertos</div>
      </div>
    </div>
    <div class="score-stat" id="score-display"></div>
    <div class="feedback-msg" id="feedback-message"></div>
    <div class="action-buttons">
      <button id="show-report-btn" class="action-btn btn-report"><i class="fas fa-list-alt"></i> Ver Correção</button>
      <button id="retry-btn"       class="action-btn btn-retry"><i class="fas fa-redo"></i> Tentar Novamente</button>
    </div>
  </div>

  <div id="report-container">
    <h3 style="color:var(--primary);margin-bottom:1.2rem;font-family:'Crimson Pro',serif;font-size:1.4rem;">
      <i class="fas fa-clipboard-list"></i> Correção Detalhada
    </h3>
    <div id="report-list" style="width:100%"></div>
    <div class="action-buttons" style="margin-top:1rem;">
      <button id="back-btn" class="action-btn btn-report"><i class="fas fa-arrow-left"></i> Voltar ao Resultado</button>
    </div>
  </div>
</div>

<div class="footer">Fisiologia Médica · Quiz gerado para estudo intensivo</div>

<script>
document.addEventListener('DOMContentLoaded',()=>{

/* ══════════════════════════════════════════════
   BANCO DE QUESTÕES COM JUSTIFICATIVAS
══════════════════════════════════════════════ */
const quizData = [

// ============================================================

{
question: "A albumina representa a principal proteína plasmática em termos de concentração e é o principal determinante da pressão oncótica do plasma. Qual das seguintes afirmações descreve corretamente o seu mecanismo molecular de ação oncótica?",
options: [
  "Liga água diretamente por pontes de hidrogênio com seus resíduos de lisina expostos",
  "Cria gradiente osmótico pela sua incapacidade de atravessar a membrana capilar semi-impermeável, retendo água no compartimento vascular",

  "Ativa a bomba Na⁺/K⁺-ATPase endotelial, bombeando ativamente água para o compartimento vascular",
  "Liga-se ao colágeno da membrana basal capilar, impedindo a filtração de água para o interstício"
],
answer: ["Cria gradiente osmótico pela sua incapacidade de atravessar a membrana capilar semi-impermeável, retendo água no compartimento vascular"],
type: "multi",
justification: `A <strong>pressão oncótica (pressão coloidosmótica)</strong> é gerada pela retenção de proteínas no compartimento vascular: como a albumina (PM ≈ 66.500 Da) não atravessa capilares normais (poros < 3 nm), cria um gradiente osmótico que retém água no plasma — <strong>Equação de Starling</strong>: filtração = Kf × [(Pc − Pi) − σ(πc − πi)].
<br><br>A albumina contribui com <strong>~80% da pressão oncótica total</strong> (25–28 mmHg), apesar de representar apenas 60% das proteínas plasmáticas, pelo seu alto número de moléculas (maior número molar que globulinas de alto PM).
<br><br><em>Clinicamente:</em> hipoalbuminemia &lt; 2,5 g/dL → edema intersticial (ascite, anasarca). Cada 1 g/dL de queda na albumina reduz pressão oncótica em ~4 mmHg.`
},

{
question: "Sobre a síntese das proteínas plasmáticas, qual(is) afirmativa(s) está(ão) correta(s)?",
options: [
  "O fígado é responsável pela síntese de praticamente todas as proteínas plasmáticas, com exceção das imunoglobulinas e do fator de von Willebrand",
  "A albumina é sintetizada como pré-pro-albumina no retículo endoplasmático rugoso dos hepatócitos, sofre clivagem do peptídeo sinal e de um propeptídeo de 6 aminoácidos antes de ser secretada",
  "As imunoglobulinas são sintetizadas pelos plasmócitos (células B diferenciadas) nos órgãos linfoides e na medula óssea",
  "A ceruloplasmina é sintetizada predominantemente nos rins e liberada em resposta à hipóxia renal",
  "A velocidade de síntese de albumina pelo fígado é de aproximadamente 15–20 g/dia em condições fisiológicas"
],
answer: [
  "O fígado é responsável pela síntese de praticamente todas as proteínas plasmáticas, com exceção das imunoglobulinas e do fator de von Willebrand",
  "A albumina é sintetizada como pré-pro-albumina no retículo endoplasmático rugoso dos hepatócitos, sofre clivagem do peptídeo sinal e de um propeptídeo de 6 aminoácidos antes de ser secretada",
  "As imunoglobulinas são sintetizadas pelos plasmócitos (células B diferenciadas) nos órgãos linfoides e na medula óssea",
  "A velocidade de síntese de albumina pelo fígado é de aproximadamente 15–20 g/dia em condições fisiológicas"
],

justification: `A <strong>hiperlipidemia da síndrome nefrótica</strong> é multifatorial:

type: "multi",
justification: `A <strong>SHBG</strong> é uma glicoproteína homodimérica sintetizada no fígado. Transporta testosterona (alta afinidade), estradiol (intermediária) e DHT (muito alta afinidade) — apenas a fração <em>livre</em> (não ligada) é biologicamente ativa.

justification: `Esta questão pede a associação <strong>INCORRETA</strong>. O hipotireoidismo congênito <strong>não aumenta a TBG</strong> como mecanismo compensatório. A TBG é regulada por estrogênios, corticosteroides, hormônios tiroideios (T3 em excesso a reduz levemente) e estado nutricional — não existe feedback do eixo hipotálamo-hipófise-tireoide sobre a TBG.

question: "A hemopexina é uma proteína plasmática que transporta heme livre após hemólise intravascular. Qual sua importância clínica comparada à haptoglobina?",
options: [
  "A hemopexina é a segunda linha de defesa contra o heme livre: após saturação da haptoglobina, o heme liberado da Hb é captado pela hemopexina e transportado ao fígado via receptor CD91 (LRP1)",
  "A hemopexina tem maior capacidade de transporte que a haptoglobina em hemólise maciça",
  "O complexo hemopexina–heme é captado pelo mesmo receptor CD163 que capta o complexo haptoglobina–Hb",
  "A hemopexina previne a geração de radicais OH• pela reação de Fenton ao sequestrar o Fe²⁺ do heme livre antes que ele possa participar da reação",
  "Em hemólise crônica grave (ex.: HPN), tanto haptoglobina quanto hemopexina ficam consumidas/indetectáveis — o heme excedente é captado pela albumina formando metemalbumina"
],
answer: [
  "A hemopexina é a segunda linha de defesa contra o heme livre: após saturação da haptoglobina, o heme liberado da Hb é captado pela hemopexina e transportado ao fígado via receptor CD91 (LRP1)",
  "Em hemólise crônica grave (ex.: HPN), tanto haptoglobina quanto hemopexina ficam consumidas/indetectáveis — o heme excedente é captado pela albumina formando metemalbumina"
],
type: "multi",
justification: `<strong>Hierarquia de captação pós-hemólise intravascular:</strong>
<ol>
<li><strong>Haptoglobina</strong> → liga dímeros αβ de Hb → CD163 → macrófagos/Kupffer</li>
<li><strong>Hemopexina</strong> → liga heme livre (após dissociação da Hb) → <strong>CD91/LRP1</strong> (receptor compartilhado com α2-macroglobulina) → hepatócitos</li>

</ol>
O complexo <em>hemopexina–heme</em> vai ao LRP1 (não ao CD163). O CD163 é <em>exclusivo</em> do complexo haptoglobina–Hb.
<br><br><em>Valor diagnóstico:</em> metemalbumina detectável no plasma = hemólise grave com saturação de haptoglobina e hemopexina. Usada historicamente no diagnóstico de HPN e hemólise intravascular maciça.`

<br><br>Fração livre ↑ = concentração do fármaco farmacologicamente ativo ↑ → efeito aumentado (e toxicidade) em doses padrão calculadas para albumina normal.
<br><br><strong>Efeito combinado com IR:</strong> hipoalbuminemia → mais fármaco livre → mais fármaco disponível para filtração glomerular → mas em IR, a depuração renal reduzida → acumulação adicional. O net effect é acumulação e toxicidade potencializada.
<br><br><em>Relevância clínica específica da ceftriaxona:</em> desloca a bilirrubina da albumina → icterícia neonatal (contraindicada em RN &lt;41 semanas ou com hiperbilirrubinemia) e potencializa o kernicterus. Em adultos criticamente doentes com hypoalbuminemia grave, rever doses de fármacos altamente ligados à albumina.`
},

{
question: "A proteína ligadora de IGF-3 (IGFBP-3) é a principal proteína ligadora de IGF-1 no plasma, transportando a grande maioria do IGF-1 circulante em complexo ternário com o IGF-1 e uma subunidade ácido-lábil (ALS); sua dosagem junto com a do IGF-1 melhora o diagnóstico de excesso e deficiência de GH.",
answer: "V",
type: "tf",
justification: `<strong>Verdadeiro.</strong> O <strong>IGF-1</strong> (Insulin-like Growth Factor 1) circula 99% ligado a proteínas ligadoras (IGFBPs 1–6), com ~75% no <em>complexo ternário</em>: IGF-1 + <strong>IGFBP-3</strong> (ou IGFBP-5) + <strong>ALS (Acid-Labile Subunit)</strong>, formando complexo de 150 kDa que não cruza capilares → reservatório circulante com t½ de 12–15 horas.
<br><br><strong>Vantagens diagnósticas da IGFBP-3:</strong>
<ul>
<li>Ambas (IGF-1 e IGFBP-3) são GH-dependentes → caem na deficiência de GH e sobem na acromegalia</li>
<li>IGFBP-3 tem menor variação diurna que o GH (mais estável para dosagem)</li>
<li>Combinação IGF-1 + IGFBP-3 + ALS aumenta sensibilidade diagnóstica para deficiência de GH em adultos</li>
</ul>
<em>Clínica:</em> IGF-1 + IGFBP-3 baixos com resposta inadequada ao teste de estimulação de GH = deficiência de GH do adulto. Acromegalia: IGF-1 muito elevado + falha de supressão do GH com 75g glicose (teste de supressão oral).`
}
]


/* ══════════════ ESTADO DO QUIZ ══════════════ */
let currentQ = 0;
let userAnswers  = new Array(quizData.length).fill(null).map(()=>[]);
let attempted    = new Array(quizData.length).fill(false);

/* ══════════════ ELEMENTOS DOM ══════════════ */
const content     = document.getElementById('quiz-content');
const progressFill= document.getElementById('quiz-progress');
const progressLbl = document.getElementById('progress-label');
const prevBtn     = document.getElementById('prev-btn');
const answerBtn   = document.getElementById('answer-btn');
const nextBtn     = document.getElementById('next-btn');
const submitBtn   = document.getElementById('submit-btn');
const resultsDiv  = document.getElementById('results-container');
const reportDiv   = document.getElementById('report-container');
const navDiv      = document.getElementById('navigation-buttons');
const progressWrap= document.querySelector('.progress-wrapper');

/* ══════════════ RENDER ══════════════ */
function init(){
  shuffleArray(quizData);
  renderAll();
  goTo(0);
  bindEvents();
}

function shuffleArray(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} }

function renderAll(){
  content.innerHTML='';
  quizData.forEach((q,i)=>{
    const card = document.createElement('div');
    card.className='question-card';
    card.id=`q-${i}`;

    const badgeClass = q.type==='tf' ? 'badge-tf' : 'badge-multi';
    const badgeText  = q.type==='tf' ? '✦ V/F' : '◈ Múltipla escolha';

    let optsHTML='';
    if(q.type==='tf'){
      optsHTML=`<div class="tf-options-container">
        <button class="tf-option tf-v" data-q="${i}" data-o="V"><i class="fas fa-check"></i> Verdadeiro</button>
        <button class="tf-option tf-f" data-q="${i}" data-o="F"><i class="fas fa-times"></i> Falso</button>
      </div>`;
    } else {
      const letters=['A','B','C','D','E','F'];
      optsHTML=`<div class="options-container">${q.options.map((opt,oi)=>`
        <button class="mc-option" data-q="${i}" data-o="${opt.replace(/"/g,'&quot;')}">
          <span class="option-indicator">${letters[oi]}</span>
          <span>${opt}</span>
        </button>`).join('')}</div>`;
    }

    card.innerHTML=`
      <div class="q-meta">
        <span class="q-num">Questão ${i+1} / ${quizData.length}</span>
        <span class="q-type-badge ${badgeClass}">${badgeText}</span>
      </div>
      <p class="question-text">${q.question}</p>
      ${optsHTML}
      <div class="feedback" id="fb-${i}"></div>`;
    content.appendChild(card);
  });
}

/* ══════════════ NAVIGATION ══════════════ */
function goTo(idx){
  if(idx<0||idx>=quizData.length) return;
  document.querySelector(`#q-${currentQ}`)?.classList.remove('active');
  currentQ=idx;
  document.querySelector(`#q-${currentQ}`)?.classList.add('active');
  updateUI();
}

function updateUI(){
  const done = attempted.filter(Boolean).length;
  progressFill.style.width=`${(done/quizData.length)*100}%`;
  progressLbl.textContent=`${done} / ${quizData.length}`;

  const isAttempted = attempted[currentQ];
  const hasSelection= userAnswers[currentQ].length>0;
  const isLast = currentQ===quizData.length-1;

  setBtn(prevBtn,   currentQ>0);
  setBtn(answerBtn, !isAttempted);
  setBtn(nextBtn,   isAttempted && !isLast);
  setBtn(submitBtn, isAttempted && isLast);
  if(!isAttempted) answerBtn.disabled=!hasSelection;
}

function setBtn(btn,show){ btn.classList.toggle('show',show); }

/* ══════════════ SELECTION ══════════════ */
function bindEvents(){
  content.addEventListener('click',e=>{
    const mc=e.target.closest('.mc-option');
    const tf=e.target.closest('.tf-option');
    if(mc) handleMC(mc);
    if(tf) handleTF(tf);
  });
  answerBtn.addEventListener('click', validate);
  nextBtn.addEventListener('click',()=>goTo(currentQ+1));
  prevBtn.addEventListener('click',()=>goTo(currentQ-1));
  submitBtn.addEventListener('click', finishQuiz);
  document.getElementById('show-report-btn').addEventListener('click',()=>{resultsDiv.style.display='none';reportDiv.style.display='flex';});
  document.getElementById('back-btn').addEventListener('click',()=>{reportDiv.style.display='none';resultsDiv.style.display='flex';});
  document.getElementById('retry-btn').addEventListener('click',()=>location.reload());
}

function handleMC(btn){
  if(btn.classList.contains('disabled')) return;
  const qi=parseInt(btn.dataset.q), opt=btn.dataset.o;
  const idx=userAnswers[qi].indexOf(opt);
  if(idx>-1){ userAnswers[qi].splice(idx,1); btn.classList.remove('selected'); }
  else{ userAnswers[qi].push(opt); btn.classList.add('selected'); }
  updateUI();
}

function handleTF(btn){
  if(btn.classList.contains('disabled')) return;
  const qi=parseInt(btn.dataset.q), opt=btn.dataset.o;
  userAnswers[qi]=[opt];
  document.querySelectorAll(`.tf-option[data-q='${qi}']`).forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  updateUI();
}

/* ══════════════ VALIDATE ══════════════ */
function validate(){
  if(attempted[currentQ]) return;
  const q=quizData[currentQ];
  const fb=document.getElementById(`fb-${currentQ}`);
  const userAns=userAnswers[currentQ]||[];
  const correctAns=Array.isArray(q.answer)?q.answer:[q.answer];
  const isCorrect=JSON.stringify([...userAns].sort())===JSON.stringify([...correctAns].sort());

  // mark options
  const sel = q.type==='tf' ? `.tf-option[data-q='${currentQ}']` : `.mc-option[data-q='${currentQ}']`;
  document.querySelectorAll(sel).forEach(opt=>{
    opt.classList.add('disabled');
    const ov=opt.dataset.o;
    if(correctAns.includes(ov)) opt.classList.add('correct');
    else if(userAns.includes(ov)) opt.classList.add('incorrect');
  });

  // build feedback
  const icon = isCorrect ? 'fa-check-circle' : 'fa-times-circle';
  const title= isCorrect ? 'Correto!' : 'Incorreto';
  const verdictClass = isCorrect ? 'correct' : 'incorrect';

  let correctListHTML='';
  if(!isCorrect){
    correctListHTML=`<div style="margin-top:.5rem;font-size:.82rem;color:var(--muted2);">${correctAns.length>1?'Respostas corretas':'Resposta correta'}:</div>
    <ul class="correct-list">${correctAns.map(a=>`<li>${a}</li>`).join('')}</ul>`;
  }

  fb.className=`feedback ${verdictClass}`;
  fb.innerHTML=`
    <div class="feedback-verdict"><i class="fas ${icon}"></i>${title}${correctListHTML}</div>
    <div class="justification">
      <div class="just-label"><i class="fas fa-flask"></i> Justificativa Clínico-Molecular</div>
      <div class="just-text">${q.justification}</div>
    </div>`;
  fb.style.display='block';

  toast(isCorrect);
  attempted[currentQ]=true;
  [answerBtn,nextBtn,submitBtn,prevBtn].forEach(b=>b.disabled=true);

  setTimeout(()=>{
    [answerBtn,nextBtn,submitBtn,prevBtn].forEach(b=>b.disabled=false);
    const isLast=currentQ===quizData.length-1;
    if(isLast) finishQuiz(); else goTo(currentQ+1);
  },2400);
}

/* ══════════════ RESULTS ══════════════ */
function finishQuiz(){
  let score=0;
  quizData.forEach((q,i)=>{
    const ua=userAnswers[i]||[];
    const ca=Array.isArray(q.answer)?q.answer:[q.answer];
    if(JSON.stringify([...ua].sort())===JSON.stringify([...ca].sort())) score++;
  });
  const pct=Math.round(score/quizData.length*100);

  document.getElementById('pct-display').textContent=`${pct}%`;
  document.getElementById('score-display').innerHTML=`Acertos: <strong>${score} de ${quizData.length}</strong>`;

  // Animate ring
  const circumference=408.4;
  const ring=document.getElementById('score-ring');
  setTimeout(()=>{ ring.style.strokeDashoffset=circumference*(1-pct/100); },100);

  const msg=document.getElementById('feedback-message');
  if(pct>=90) msg.textContent='🎉 Excelente domínio! Você está pronto para a prova.';
  else if(pct>=70) msg.textContent='👏 Muito bem! Revise os pontos que errou e você chegará lá.';
  else if(pct>=50) msg.textContent='👍 Bom esforço! Revise as justificativas com atenção.';
  else msg.textContent='💪 Continue estudando! As justificativas abaixo são seu mapa.';

  buildReport();

  content.style.display='none';
  navDiv.style.display='none';
  progressWrap.style.display='none';
  resultsDiv.style.display='flex';
}

function buildReport(){
  const list=document.getElementById('report-list');
  list.innerHTML='';
  quizData.forEach((q,i)=>{
    const ua=userAnswers[i]||[];
    const ca=Array.isArray(q.answer)?q.answer:[q.answer];
    const ok=JSON.stringify([...ua].sort())===JSON.stringify([...ca].sort());
    const item=document.createElement('div');
    item.className=`report-item ${ok?'correct':'incorrect'}`;
    item.innerHTML=`<p class="ri-q"><strong>Questão ${i+1}:</strong> ${q.question}</p>
      <p><strong>Sua resposta:</strong> ${ua.length?ua.join(', '):'<em>Não respondida</em>'}</p>
      <p><strong>Correta:</strong> ${ca.join(', ')}</p>`;
    list.appendChild(item);
  });
}

/* ══════════════ TOAST ══════════════ */
function toast(ok){
  Swal.mixin({
    toast:true,position:'top-end',
    showConfirmButton:false,
    timer:1400,timerProgressBar:true,
    background: ok ? '#0a2e1f' : '#2e0a14',
    color: ok ? '#34d399' : '#fb7185',
  }).fire({icon:ok?'success':'error',title:ok?'✓ Correto!':'✗ Incorreto!'});
}

init();
});
</script>
